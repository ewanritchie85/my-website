name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy Backend
        run: |
          sudo cp backend/get_spotify_info.py /home/ewanritchie/spotipy_project/
          sudo systemctl restart spotify-flask

      - name: Deploy Frontend
        run: |
          sudo rm -rf /var/www/html/*
          sudo cp -r ./* /var/www/html/
          sudo rm -rf /var/www/html/backend
          sudo rm -f /var/www/html/.gitignore /var/www/html/README.md /var/www/html/.editorconfig /var/www/html/requirements-dev.txt
          sudo rm -rf /var/www/html/tests /var/www/html/.pytest_cache

      - name: Reload Nginx
        run: sudo systemctl reload nginx